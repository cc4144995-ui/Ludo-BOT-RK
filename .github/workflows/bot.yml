name: Run Ludo Star Bot 24/7

on:
  push:
    branches: [ main ]
  schedule:
    # প্রতি ৬ ঘণ্টা পর পর রিস্টার্ট হবে যাতে ক্লাউড সেশন সচল থাকে
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node.spec-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Bot
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ROOM_ID: ${{ secrets.ROOM_ID }}
        run: node index.js
